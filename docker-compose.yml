services:
  api:
    build:
      context: .
      target: api
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql+psycopg2://bootcamp:bootcamp@db:5432/bootcamp
      APP_ENV: ${APP_ENV:-local}
      SERVICE_NAME: ${SERVICE_NAME:-antifraude-pix}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-default_token}
      SERASA_API_URL: http://serasa_mock:8080
      DICT_API_URL: http://dict_mock:8080
      EXTERNAL_TIMEOUT: ${EXTERNAL_TIMEOUT:-2}
    volumes:
      - ./src:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/health_check')"]
      interval: 3s
      timeout: 5s
      retries: 20
    depends_on:
      db:
        condition: service_healthy
      serasa_mock:
        condition: service_healthy
      dict_mock:
        condition: service_healthy

  db:
    build: ./database
    environment:
      POSTGRES_USER: bootcamp
      POSTGRES_PASSWORD: bootcamp
      POSTGRES_DB: bootcamp
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pix_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bootcamp -d bootcamp"]
      interval: 3s
      timeout: 3s
      retries: 20

  serasa_mock:
    build:
      context: .
      dockerfile: mocks/Dockerfile
    environment:
      MOCK_PROVIDER: serasa
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-default_token}
    ports:
      - "127.0.0.1:${SERASA_MOCK_PORT:-8001}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health_check')"]
      interval: 3s
      timeout: 3s
      retries: 20

  dict_mock:
    build:
      context: .
      dockerfile: mocks/Dockerfile
    environment:
      MOCK_PROVIDER: dict
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-default_token}
    ports:
      - "127.0.0.1:${DICT_MOCK_PORT:-8002}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health_check')"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pix_pgdata:
